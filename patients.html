<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Portal | Samartex Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="navbar">

        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Samartex Hospital Logo">
            <span>Samartex Hospital</span>
        </a>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="departments.html">Departments</a>
            <a href="services.html">Services</a>
            <a href="doctors.html">Doctors</a>
            <a href="appointments.html">Appointments</a>
            <a class="active" href="patients.html">Patients</a>
            <a href="pharmacy.html">Pharmacy</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>

    </div>
</header>

<section class="page-header">
    <h1>Patient Portal</h1>
    <p>Patient registration and portal access.</p>
</section>

<section class="section">

<form id="patientForm">

    <h2>Patient Registration</h2>

    <br>

    <div class="form-grid">

        <div class="field">
            <label>Full Name</label>
            <input type="text" required>
        </div>

        <div class="field">
            <label>Date of Birth</label>
            <input type="date" required>
        </div>

        <div class="field">
            <label>Gender</label>

            <select required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="field">
            <label>Phone Number</label>
            <input type="tel" required>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email">
        </div>

        <div class="field">
            <label>Patient ID</label>
            <input type="text" placeholder="If already registered">
        </div>

        <div class="field full">
            <button class="submit" type="submit">
                Register Patient
            </button>
        </div>

    </div>

</form>

</section>

<footer>
    <div class="copyright">
<a href="admin.html">    © </a>2026 Samartex Hospital. All Rights Reserved.
    </div>
</footer>

<script src="script.js"></script>

<script>
document.getElementById("patientForm").addEventListener("submit", function(event) {

    event.preventDefault();

    alert("Patient registration submitted successfully.");

    this.reset();

});
</script>

</body>
</html>
